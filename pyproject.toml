[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoflow-atlas"
version = "2.0.0"
description = "Reproducible, offline exploration of matched cancer multi-omics"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3"]

[project.scripts]
oncoflow-atlas = "oncoflow_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oncoflow_atlas = ["web/*.html", "web/*.js", "web/*.css"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
